name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: Static checks
        run: |
          node --check background.js
          node --check sidepanel.js
          node --check capture-graph.js
          node --check replay-matcher.js
          node --check tests/capture-graph.mjs
          node --check tests/replay-matcher.mjs
          node --check tests/golden-capture.mjs
          node --check tests/browser-integration.mjs
          node --check tests/start-overlay-regression.mjs
          node --check tests/deep-runtime-regression.mjs
          node --check tests/archive-safety-regression.mjs
      - name: Start-overlay regression check
        run: node tests/start-overlay-regression.mjs
      - name: Deep runtime regression check
        run: node tests/deep-runtime-regression.mjs
      - name: Archive safety regression check
        run: node tests/archive-safety-regression.mjs
      - name: Capture graph replay projection check
        run: node tests/capture-graph.mjs
      - name: Hermetic replay matcher check
        run: node tests/replay-matcher.mjs
      - name: Golden archive check
        run: node tests/golden-capture.mjs tests/fixtures/offline-archive
      - name: Browser integration check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/browser-integration.mjs tests/fixtures/offline-archive
