name: Feature request
description: Suggest a generic improvement to the capture pipeline
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the capture limitation, not just a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Affected mode
      multiple: true
      options:
        - Quick
        - Deep
        - Element picker
        - Offline archive
        - Test harness
