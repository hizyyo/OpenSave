<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>openSave</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e1016;color:#e4ded7;font-family:system-ui;padding:16px}
h1{font-size:16px;margin-bottom:2px}
.desc{font-size:11px;color:#888;margin-bottom:14px}
.btn{width:100%;padding:10px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px}
.btn-capture{background:#22c55e;color:#000}
.btn-secondary{background:#252a35;color:#e4ded7}
.btn-cancel{background:#3a1d22;color:#fecaca}
.btn-capture:disabled{background:#333;color:#666;cursor:not-allowed}
.capture-mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 10px}
.capture-mode label{display:block;cursor:pointer;border:1px solid #303747;border-radius:6px;padding:8px;background:#15171e}
.capture-mode input{position:absolute;opacity:0;pointer-events:none}
.capture-mode label:has(input:checked){border-color:#22c55e;background:#102418}
.capture-mode strong{display:block;font-size:11px;color:#e4ded7;margin-bottom:2px}
.capture-mode span{display:block;font-size:10px;color:#888;line-height:1.25}
.archive-options{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 10px;color:#888;font-size:10px}
.archive-options input{width:74px;background:#15171e;color:#e4ded7;border:1px solid #303747;border-radius:5px;padding:5px}
.progress{display:none;background:#212531;border-radius:6px;padding:12px;margin-bottom:8px}
.progress-stage{font-size:11px;color:#22c55e;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.progress-bar{height:4px;background:#333;border-radius:2px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:#22c55e;width:0%;transition:width .3s}
.status{font-size:12px;color:#aaa;min-height:20px}
.summary-card{display:none;background:#15171e;border:1px solid #252a35;border-radius:6px;padding:12px;margin-top:8px;font-size:12px;line-height:1.6}
.summary-card.ready{border-color:#22c55e}
.summary-card.partial{border-color:#f59e0b}
.summary-card.failed{border-color:#ef4444}
.summary-card.cancelled{border-color:#f59e0b}
.summary-headline{font-size:13px;font-weight:700;margin-bottom:6px}
.summary-headline.ready{color:#22c55e}
.summary-headline.partial{color:#f59e0b}
.summary-headline.failed{color:#ef4444}
.summary-headline.cancelled{color:#f59e0b}
.action-banner{margin-top:8px;padding:8px;background:#1e2430;border-left:3px solid #3b82f6;border-radius:4px;font-size:11px;color:#dbeafe}
.details-toggle{margin-top:10px;cursor:pointer;color:#888;font-size:11px;user-select:none;display:flex;align-items:center;gap:4px}
.details-toggle:hover{color:#aaa}
.log{background:#0e1016;border:1px solid #212531;border-radius:6px;padding:10px;max-height:250px;overflow-y:auto;font-size:11px;color:#888;line-height:1.5;font-family:monospace;margin-top:6px;display:none}
.log .ok{color:#22c55e}
.log .err{color:#ef4444}
.report{display:none;margin-top:8px;font-size:11px;color:#aaa;line-height:1.5}
.report strong{color:#e4ded7}
.report .warn{color:#f59e0b}
</style>
</head><body>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px"><img src="logo.png" width="24" height="24" alt="openSave"><h1 style="margin:0">openSave</h1></div>
<p class="desc">Полная офлайн-копия любого сайта</p>
<div class="capture-mode" id="captureMode">
  <label><input type="radio" name="captureMode" value="quick" checked><strong>Быстро</strong><span>Текущая страница и прямые зависимости</span></label>
  <label><input type="radio" name="captureMode" value="deep"><strong>Глубоко</strong><span>Сайт, UI-состояния, API, cache, crawler</span></label>
</div>
<label class="archive-options" for="archiveLimitMb"><span>Предупреждать о размере архива после</span><span><input id="archiveLimitMb" type="number" min="25" step="25" value="500"> MB</span></label>
<button class="btn btn-capture" id="btnCapture">Скачать страницу</button>
<button class="btn btn-secondary" id="btnPickElement">Выбрать блок на странице</button>
<button class="btn btn-secondary" id="btnRecord">Записать сценарий</button>
<button class="btn btn-capture" id="btnFinishScenario" hidden>Остановить и захватить</button>
<button class="btn btn-cancel" id="btnCancelCapture" hidden>Отменить захват</button>
<div class="progress" id="progress">
  <div class="progress-stage" id="stage">Подготовка</div>
  <div class="status" id="status">Подготовка...</div>
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
</div>
<div class="summary-card" id="summaryCard"></div>
<div class="details-toggle" id="detailsToggle" style="display:none;">
  <span id="toggleIcon">▶</span> Подробности и диагностика
</div>
<div class="report" id="report"></div>
<div class="log" id="log"></div>
<script src="lib/jszip.min.js"></script>
<script src="capture-graph.js"></script>
<script src="capture-storage.js"></script>
<script src="resource-parser.js"></script>
<script src="rendered-page-crawler.js"></script>
<script src="replay-matcher.js"></script>
<script src="privacy-guardrails.js"></script>
<script src="archive-optimizer.js"></script>
<script src="archive-validator.js"></script>
<script src="sidepanel.js"></script>
</body></html>
