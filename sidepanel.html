<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>SiteSaver</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e1016;color:#e4ded7;font-family:system-ui;padding:16px}
h1{font-size:16px;margin-bottom:2px}
.desc{font-size:11px;color:#888;margin-bottom:14px}
.btn{width:100%;padding:10px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px}
.btn-capture{background:#22c55e;color:#000}
.btn-secondary{background:#252a35;color:#e4ded7}
.btn-capture:disabled{background:#333;color:#666;cursor:not-allowed}
.capture-mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 10px}
.capture-mode label{display:block;cursor:pointer;border:1px solid #303747;border-radius:6px;padding:8px;background:#15171e}
.capture-mode input{position:absolute;opacity:0;pointer-events:none}
.capture-mode label:has(input:checked){border-color:#22c55e;background:#102418}
.capture-mode strong{display:block;font-size:11px;color:#e4ded7;margin-bottom:2px}
.capture-mode span{display:block;font-size:10px;color:#888;line-height:1.25}
.progress{display:none;background:#212531;border-radius:6px;padding:12px;margin-bottom:8px}
.progress-bar{height:4px;background:#333;border-radius:2px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:#22c55e;width:0%;transition:width .3s}
.status{font-size:12px;color:#aaa;min-height:20px}
.log{background:#15171e;border-radius:6px;padding:10px;max-height:300px;overflow-y:auto;font-size:11px;color:#888;line-height:1.5;font-family:monospace;display:none}
.log .ok{color:#22c55e}
.log .err{color:#ef4444}
.report{display:none;background:#15171e;border-radius:6px;padding:10px;margin-top:8px;font-size:11px;color:#aaa;line-height:1.5}
.report strong{color:#e4ded7}
.report .warn{color:#f59e0b}
</style>
</head><body>
<h1>SiteSaver</h1>
<p class="desc">Полная офлайн-копия любого сайта</p>
<div class="capture-mode" id="captureMode">
  <label><input type="radio" name="captureMode" value="quick" checked><strong>Быстро</strong><span>Текущая страница и прямые зависимости</span></label>
  <label><input type="radio" name="captureMode" value="deep"><strong>Глубоко</strong><span>Сайт, UI-состояния, API, cache, crawler</span></label>
</div>
<button class="btn btn-capture" id="btnCapture">Скачать страницу</button>
<button class="btn btn-secondary" id="btnPickElement">Выбрать блок на странице</button>
<button class="btn btn-secondary" id="btnRecord">Записать сценарий</button>
<button class="btn btn-capture" id="btnFinishScenario" hidden>Остановить и захватить</button>
<div class="progress" id="progress">
  <div class="status" id="status">Подготовка...</div>
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
</div>
<div class="log" id="log"></div>
<div class="report" id="report"></div>
<script src="lib/jszip.min.js"></script>
<script src="sidepanel.js"></script>
</body></html>
